apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: collage-alarm
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  # Use NodePort for direct access without Ingress (e.g. on minikube/bare-metal).
  # Change to ClusterIP if you use the Ingress below.
  type: NodePort
