# IMPORTANT: Before applying, replace the placeholder values below with real secrets.
# Generate base64:  echo -n 'your-value' | base64
#
# Or use kubectl directly (avoids committing secrets to git):
#   kubectl create secret generic collage-alarm-secret \
#     --namespace=collage-alarm \
#     --from-literal=ADMIN_PASSWORD='your-password' \
#     --from-literal=JWT_SECRET='your-jwt-secret'
apiVersion: v1
kind: Secret
metadata:
  name: collage-alarm-secret
  namespace: collage-alarm
type: Opaque
data:
  # echo -n 'admin123' | base64
  ADMIN_PASSWORD: YWRtaW4xMjM=
  # echo -n 'secret-key-collage-alarm' | base64
  JWT_SECRET: c2VjcmV0LWtleS1jb2xsYWdlLWFsYXJt
