apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: collage-alarm

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

